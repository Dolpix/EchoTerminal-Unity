site_name: Echo Terminal
site_url: https://dolpix.github.io/EchoTerminal/
repo_url: https://github.com/Dolpix/EchoTerminal
repo_name: Dolpix/EchoTerminal

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - tables

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Common Tasks: common-tasks.md
  - Features:
    - Commands: features/commands.md
    - Type Parsers: features/type-parsers.md
    - Autocomplete & Suggestions: features/autocomplete.md
    - GameObject Targeting: features/targeting.md
    - UI Components: features/ui-components.md
    - Highlighting Themes: features/highlighting.md
    - Command Tags: features/command-tags.md
    - Inputs: features/inputs.md
  - Contributing: contributing.md
